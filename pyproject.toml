[project]
name = "llm-inference-engine"
version = "0.1.0"
description = "Learning inference engineering by building a serving stack"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[dependency-groups]
# Phase 1+ (the deliberately-bad baseline and beyond). Not needed for Phase 0.
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[tool.uv]
# vllm and torch are installed only on the GPU box -- they have no macOS wheels
# worth having and would make `uv sync` here miserable.
package = false
