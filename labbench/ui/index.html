<title>lab bench</title>
<script>
try {
  const saved = localStorage.getItem("llm-ui-theme");
  document.documentElement.dataset.theme = saved === "cream" || saved === "dark"
    ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "cream");
} catch (_) {}
</script>
<link rel="stylesheet" href="app.css">
</head>

<div id="root"></div>

<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/htm.js"></script>
<script src="app.js"></script>
</body>
</html>
